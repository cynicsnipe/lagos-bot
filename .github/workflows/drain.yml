name: Create Accounts
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of accounts to create'
        required: true
        default: '50'

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install playwright

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run account creator
        run: node create.js
        env:
          ACCOUNT_COUNT: ${{ github.event.inputs.count }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit accounts to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add store/
          git diff --staged --quiet || git commit -m "accounts batch $(date +%Y%m%d-%H%M%S)"
          git push
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: accounts-${{ github.run_number }}
          path: store/
